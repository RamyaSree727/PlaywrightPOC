name: Scheduled Regression Suite - Org1 & Org2

on:
  schedule:
    # Runs daily at 00:00 UTC (Modify cron expression as per schedule requirement)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      recipient_email:
        description: 'Recipient Email ID'
        required: false
        default: 'nagasree727@gmail.com'

jobs:
  regression-tests:
    name: Execute Org1 & Org2 Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers with dependencies
        run: npx playwright install --with-deps

      - name: Run Org1 and Org2 Regression Tests
        id: run_tests
        continue-on-error: true
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=results.json npx playwright test Tests/Org1 Tests/Org2 --reporter=json,html,line

      - name: Generate Orgwise Dashboard HTML
        if: always()
        run: |
          node generate-dashboard.js
          if [ -f "playwright-report/index.html" ]; then
            cp playwright-report/index.html playwright-test-report.html
          fi

      - name: Commit Updated Dashboard Data (for GitHub Pages tracking)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard-history.json dashboard.html index.html
          git commit -m "auto: update regression dashboard data [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed or no remote changes"

      - name: Upload Test Report & Dashboard Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-org1-org2-dashboard
          path: |
            dashboard.html
            playwright-report/
          retention-days: 30

      - name: Send Combined Email Notification with Dashboard
        uses: dawidd6/action-send-mail@v4
        if: always()
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Orgwise Regression Summary & Test Results [Org1 & Org2] - Outcome: ${{ steps.run_tests.outcome }}"
          to: ${{ github.event.inputs.recipient_email || 'nagasree727@gmail.com' }}
          from: "Playwright Test Automation <${{ secrets.SMTP_USERNAME }}>"
          secure: true
          priority: normal
          html_body: file://email-body.html
          attachments: dashboard.html,playwright-test-report.html
