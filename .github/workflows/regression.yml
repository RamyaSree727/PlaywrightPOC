name: Scheduled Regression Suite - Org1 & Org2

on:
  schedule:
    # Runs daily at 00:00 UTC (Modify cron expression as per schedule requirement)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      recipient_email:
        description: 'Recipient Email ID'
        required: false
        default: 'nagasree727@gmail.com'

jobs:
  regression-tests:
    name: Execute Org1 & Org2 Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers with dependencies
        run: npx playwright install --with-deps

      - name: Run Org1 and Org2 Regression Tests
        id: run_tests
        continue-on-error: true
        run: |
          npx playwright test Tests/Org1 Tests/Org2 --reporter=html,line

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-org1-org2-report
          path: playwright-report/
          retention-days: 30

      - name: Send Combined Email Notification
        uses: dawidd6/action-send-mail@v4
        if: always()
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Regression Test Results [Org1 & Org2] - Outcome: ${{ steps.run_tests.outcome }}"
          to: ${{ github.event.inputs.recipient_email || 'nagasree727@gmail.com' }}
          from: "Playwright Test Automation <${{ secrets.SMTP_USERNAME }}>"
          secure: true
          priority: normal
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
                .header { background-color: #0056b3; color: white; padding: 15px; text-align: center; border-radius: 5px 5px 0 0; }
                .status-pass { color: #28a745; font-weight: bold; }
                .status-fail { color: #dc3545; font-weight: bold; }
                .table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                .table th, .table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                .table th { background-color: #f2f2f2; }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="header">
                  <h2>Combined Regression Execution Report</h2>
                </div>
                <p>Hello Team,</p>
                <p>The scheduled regression testing for <strong>Org1</strong> and <strong>Org2</strong> test folders has completed.</p>
                
                <table class="table">
                  <tr>
                    <th>Execution Status</th>
                    <td>
                      <span class="${{ steps.run_tests.outcome == 'success' && 'status-pass' || 'status-fail' }}">
                        ${{ steps.run_tests.outcome == 'success' && 'PASSED' || 'FAILED' }}
                      </span>
                    </td>
                  </tr>
                  <tr>
                    <th>Folders Executed</th>
                    <td>Tests/Org1, Tests/Org2</td>
                  </tr>
                  <tr>
                    <th>Trigger Source</th>
                    <td>${{ github.event_name }}</td>
                  </tr>
                  <tr>
                    <th>Repository</th>
                    <td>${{ github.repository }}</td>
                  </tr>
                  <tr>
                    <th>Branch</th>
                    <td>${{ github.ref_name }}</td>
                  </tr>
                  <tr>
                    <th>Run Details</th>
                    <td><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a></td>
                  </tr>
                </table>

                <p>Attached to this email is the HTML report (<code>index.html</code>).</p>
                <p>Regards,<br/>Automation Quality Assurance Team</p>
              </div>
            </body>
            </html>
          attachments: playwright-report/index.html
