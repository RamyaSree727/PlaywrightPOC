name: Scheduled Regression Suite - Org1 & Org2

on:
  schedule:
    # Runs daily at 00:00 UTC (Modify cron expression as per schedule requirement)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_org:
        description: 'Select Target Organization'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Org1
          - Org2
      recipient_email:
        description: 'Recipient Email ID'
        required: false
        default: 'nagasree727@gmail.com'

jobs:
  regression-tests:
    name: Execute Org1 & Org2 Regression Suite
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers with dependencies
        run: npx playwright install --with-deps

      - name: Run Regression Tests
        id: run_tests
        continue-on-error: true
        run: |
          TARGET="${{ github.event.inputs.target_org }}"
          if [ "$TARGET" = "Org1" ]; then
            TEST_PATH="Tests/Org1"
          elif [ "$TARGET" = "Org2" ]; then
            TEST_PATH="Tests/Org2"
          else
            TEST_PATH="Tests/Org1 Tests/Org2"
          fi
          echo "Executing tests for: $TEST_PATH"
          PLAYWRIGHT_JSON_OUTPUT_NAME=results.json npx playwright test $TEST_PATH --reporter=json,html,line

      - name: Generate Orgwise Dashboard HTML
        if: always()
        run: |
          node generate-dashboard.js
          if [ -f "playwright-report/index.html" ]; then
            cp playwright-report/index.html playwright-test-report.html
          fi

      - name: Commit Updated Dashboard Data (for GitHub Pages tracking & local access)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -f dashboard-history.json index.html playwright-test-report.html playwright-report/ .nojekyll
          git commit -m "auto: update regression dashboard data [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed or no remote changes"

      - name: Upload Test Report & Dashboard Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-org1-org2-dashboard
          path: |
            index.html
            dashboard-history.json
            playwright-report/
            playwright-test-report.html
          retention-days: 30

      - name: Send Combined Email Notification with Dashboard
        uses: dawidd6/action-send-mail@v4
        if: always()
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Orgwise Regression Summary & Test Results [Org1 & Org2] - Outcome: ${{ steps.run_tests.outcome }}"
          to: ${{ github.event.inputs.recipient_email || 'nagasree727@gmail.com' }}
          from: "Playwright Test Automation <${{ secrets.SMTP_USERNAME }}>"
          secure: true
          priority: normal
          html_body: file://email-body.html
          attachments: index.html,playwright-test-report.html
